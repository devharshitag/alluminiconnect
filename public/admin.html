<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin review | Student Assist</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><a href="index.html">Student Assist</a><nav><a href="dashboard.html">Dashboard</a></nav></header>
<main class="wide"><div class="card"><h1>Verification queue</h1>
<p class="sub">Review the uploaded documents and approve or reject each user.</p>
<div class="tabs" id="tabs">
<button type="button" class="tab active" data-status="pending">Pending <span id="n-pending">0</span></button>
<button type="button" class="tab" data-status="verified">Approved <span id="n-verified">0</span></button>
<button type="button" class="tab" data-status="rejected">Rejected <span id="n-rejected">0</span></button></div>
<div class="msg" id="admin-msg" role="alert"></div>
<p id="empty" class="sub hidden">Nothing here.</p>
<div id="list"></div></div></main>
<script src="js/app.js"></script><script src="js/admin.js"></script></body></html>
