<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Problems | Student Assist</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><a href="index.html">Student Assist</a><nav><a href="requests.html">Requests</a><a href="mentors.html">Find mentors</a><a href="dashboard.html">Dashboard</a></nav></header>
<main class="wide">
<details class="card" id="new-box"><summary>Post a problem</summary>
<form id="new-form" novalidate>
<label for="title">Title</label><input id="title" name="title" maxlength="200" placeholder="e.g. Stuck on dynamic programming for placements">
<label for="description">Describe the problem</label><textarea id="description" name="description" class="tall" maxlength="5000" placeholder="What have you tried? What exactly is unclear?"></textarea>
<div class="row3">
<div><label for="category">Category</label><select id="category" name="category"><option value="academic">Academic</option><option value="technical">Technical</option><option value="project">Project</option><option value="career">Career</option></select></div>
<div><label for="urgency">Urgency</label><select id="urgency" name="urgency"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></div>
<div><label for="preferred_mentor_type">Preferred mentor</label><select id="preferred_mentor_type" name="preferred_mentor_type"><option value="any">Senior or alumni</option><option value="senior">Senior</option><option value="alumni">Alumni</option></select></div></div>
<label>Topics (up to 5)</label><div class="tagpick" id="tagpick"></div>
<div class="checks" style="margin-top:10px"><label><input type="checkbox" name="is_anonymous"> Hide my name from mentors</label></div>
<button type="submit">Post problem</button><div class="msg" id="new-msg" role="alert"></div></form></details>

<div class="card" style="margin-top:16px"><h1>Problems</h1>
<p class="sub" id="psub">Loading...</p>
<div class="tabs"><button type="button" class="tab active" data-view="mine">My problems</button><button type="button" class="tab hidden" id="tab-board" data-view="board">Problem board</button></div>
<form id="pfilter" novalidate>
<input id="q" name="q" type="search" maxlength="80" placeholder="Search title or description">
<div class="row3">
<div><label for="f-category">Category</label><select id="f-category" name="category"><option value="">Any</option><option value="academic">Academic</option><option value="technical">Technical</option><option value="project">Project</option><option value="career">Career</option></select></div>
<div><label for="f-tag">Topic</label><select id="f-tag" name="tag_id"><option value="">Any topic</option></select></div>
<div><label for="f-status">Status</label><select id="f-status" name="status"><option value="">Any</option><option value="open">Open</option><option value="in_discussion">In discussion</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select></div></div>
<button type="submit">Search</button><div class="msg" id="list-msg" role="alert"></div></form></div>
<p class="sub" id="summary" style="margin:14px 2px 0"></p>
<div id="plist" class="plist"></div>
<div class="pager hidden" id="pager"><button type="button" class="alt small" id="prev">Previous</button><span id="page-info"></span><button type="button" class="alt small" id="next">Next</button></div>
</main><script src="js/app.js"></script><script src="js/problems.js"></script></body></html>
