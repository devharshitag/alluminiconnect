<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<header><a href="index.html">Student Assist</a><nav><a href="login.html">Log in</a><a href="register.html">Register</a></nav></header>
<main><div class="card"><h1>Forgot your password?</h1><p class="sub">We will email you a 6-digit reset code.</p>

<button type="submit">Send code</button><div class="msg" role="alert"></div></form>
<p class="links"><a href="login.html">Back to log in</a></p></div></main>
<script src="js/app.js"></script></body></html>
