<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sessions | Student Assist</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><a href="index.html">Student Assist</a><nav><a href="requests.html">Requests</a><a href="problems.html">Problems</a><a href="dashboard.html">Dashboard</a></nav></header>
<main class="wide">
<div class="card hidden" id="sched-card"><h1>Schedule a session</h1><p class="sub" id="sched-who"></p>
<form id="sched-form" novalidate>
<div class="row3">
<div><label for="start">Start</label><input id="start" type="datetime-local"></div>
<div><label for="duration">Length</label><select id="duration"><option value="30">30 minutes</option><option value="45">45 minutes</option><option value="60" selected>60 minutes</option><option value="90">90 minutes</option></select></div>
<div><label for="mode">Mode</label><select id="mode"><option value="call">Call</option><option value="chat">Chat</option><option value="in_person">In person</option></select></div></div>
<label for="link" id="link-label">Meeting link</label><input id="link" maxlength="255" placeholder="https://meet.google.com/...">
<button type="submit">Schedule session</button><div class="msg" id="sched-msg" role="alert"></div></form></div>

<div class="card"><h1>Sessions</h1><p class="sub">Your mentoring sessions. Times are shown as scheduled, without timezone conversion.</p>
<div class="tabs"><button type="button" class="tab active" data-scope="upcoming">Upcoming</button><button type="button" class="tab" data-scope="past">Past</button></div>
<div class="msg" id="smsg" role="alert"></div><p class="sub hidden" id="empty">No sessions here yet.</p>
<div id="slist"></div></div>
</main><script src="js/app.js"></script><script src="js/sessions.js"></script></body></html>
