<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password | Student Assist</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><a href="index.html">Student Assist</a><nav><a href="login.html">Log in</a><a href="register.html">Register</a></nav></header>
<main><div class="card"><h1>Reset password</h1><p class="sub">Enter the code and choose a new password.</p>
<form data-api="/api/auth/reset-password" data-next="login.html" novalidate>
<label for="email">Email</label><input id="email" name="email" type="email" required>
<label for="otp">Reset code</label><input id="otp" name="otp" inputmode="numeric" maxlength="6" required>
<label for="new_password">New password</label><input id="new_password" name="new_password" type="password" autocomplete="new-password" required>
<div class="hint">At least 8 characters with uppercase, lowercase, and a digit.</div>
<button type="submit">Update password</button><div class="msg" role="alert"></div></form></div></main>
<script src="js/app.js"></script></body></html>
