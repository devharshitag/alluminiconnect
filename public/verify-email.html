<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify email | Student Assist</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><a href="index.html">Student Assist</a><nav><a href="login.html">Log in</a><a href="register.html">Register</a></nav></header>
<main><div class="card"><h1>Verify your email</h1><p class="sub">Enter the 6-digit code sent to your university email.</p>
<form data-api="/api/auth/verify-email" data-next="login.html" novalidate>
<label for="email">Email</label><input id="email" name="email" type="email" required>
<label for="otp">Verification code</label><input id="otp" name="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
<button type="submit">Verify</button><div class="msg" role="alert"></div></form>
<p class="links">Did not get a code? <button type="button" id="resend" class="link">Resend code</button></p></div></main>
<script src="js/app.js"></script></body></html>
